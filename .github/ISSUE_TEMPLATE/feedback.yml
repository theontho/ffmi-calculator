name: Calculator feedback
description: Report confusing behavior, mobile problems, or accessibility barriers.
title: "[Feedback]: "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inputs and current FFMI
        - Muscle-gain projection
        - Fat-loss projection
        - Mobile layout
        - Accessibility
        - Other calculator behavior
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      placeholder: Describe the goal and the values you entered.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was confusing or did not work?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari 18 on iPhone 15
